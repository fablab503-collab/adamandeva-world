/* AiRumors · adamandeva.world edition. Same type and colours as the desk: Dotwork (the dot-matrix "byte" face) for the
   wordmark and every score, Space Grotesk for reading, Space Mono for labels and data. Black and white only, and the
   sections alternate: white, black, white, black. Colour on scores is optional (Heat or Rainbow switch). */
:root{
  --bg:#FFFFFF; --ink:#000000; --ink2:#5A6472; --hair:#C6CCD6; --panel:#F0F2F6; --sel:#000000; --on-sel:#FFFFFF;
  --glass:rgba(255,255,255,.92); color-scheme:light;
  --f-text:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"Space Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --f-dot:"Dotwork","Space Mono",ui-monospace,monospace;
  --pill:999px; --w:1080px;
}
/* the black bands of a white page */
.band,.sheet-card.band{--bg:#000000; --ink:#FFFFFF; --ink2:#A9B2C0; --hair:#2A313C; --panel:#14181F; --sel:#FFFFFF; --on-sel:#000000; color-scheme:dark}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0A0C10; --ink:#F1F4F8; --ink2:#96A0B0; --hair:#2A313C; --panel:#14181F; --sel:#F1F4F8; --on-sel:#0A0C10; --glass:rgba(10,12,16,.92); color-scheme:dark}
  :root:not([data-theme="light"]) .band{--bg:#F1F4F8; --ink:#0A0C10; --ink2:#4E5866; --hair:#C6CCD6; --panel:#E3E7ED; --sel:#0A0C10; --on-sel:#F1F4F8; color-scheme:light}
}
:root[data-theme="dark"]{--bg:#0A0C10; --ink:#F1F4F8; --ink2:#96A0B0; --hair:#2A313C; --panel:#14181F; --sel:#F1F4F8; --on-sel:#0A0C10; --glass:rgba(10,12,16,.92); color-scheme:dark}
:root[data-theme="dark"] .band{--bg:#F1F4F8; --ink:#0A0C10; --ink2:#4E5866; --hair:#C6CCD6; --panel:#E3E7ED; --sel:#0A0C10; --on-sel:#F1F4F8; color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--f-text);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
.embed body{padding-bottom:110px}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
a{color:inherit;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
a:hover{text-decoration-style:solid}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.w{max-width:var(--w);margin:0 auto;padding-inline:16px}
@media (min-width:735px){.w{padding-inline:24px}}
.num{font-variant-numeric:tabular-nums lining-nums}
.dw{font-family:var(--f-dot);font-weight:400;letter-spacing:.04em}
.mono{font-family:var(--f-mono)}

/* nav: the only glass on the page, like the desk's tab bar */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--hair)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.nav{background:var(--bg)}}
.nav .w{display:flex;align-items:center;gap:18px;height:48px}
.mark{background:none;border:0;padding:0;cursor:pointer;font:400 19px/1 var(--f-dot);letter-spacing:.06em;color:var(--ink);flex:none;text-transform:uppercase}
.links{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0;height:100%;align-items:center;padding-right:28px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.links::-webkit-scrollbar{display:none}
.links button{flex:none;background:none;border:0;padding:0;height:100%;font:400 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent}
.links button:hover{color:var(--ink)}
.links button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.lang{display:flex;gap:2px;flex:none}
.lang button{background:none;border:0;padding:6px;min-height:28px;font:400 11px/1 var(--f-mono);letter-spacing:.12em;color:var(--ink2);cursor:pointer;border-radius:6px}
.lang button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px}

main{min-height:70vh}
.view{display:flex;flex-direction:column}
section.s{padding-block:48px;background:var(--bg);color:var(--ink)}
@media (min-width:735px){section.s{padding-block:72px}}
.stack{display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;font-family:var(--f-text);font-weight:500;text-wrap:balance}
h1{font-size:36px;line-height:1.08;letter-spacing:-.025em}
h2{font-size:26px;line-height:1.15;letter-spacing:-.02em}
h3{font-size:18px;line-height:1.25;letter-spacing:-.01em}
@media (min-width:735px){h1{font-size:48px}h2{font-size:30px}}
@media (min-width:1069px){h1{font-size:56px}}
.eyebrow{font:400 12px/1.4 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin:0}
.lede{font-size:19px;line-height:1.45;color:var(--ink2);margin:8px 0 0;max-width:640px}
@media (min-width:735px){.lede{font-size:21px}}
.meta{font:400 12px/1.5 var(--f-mono);letter-spacing:.02em;color:var(--ink2)}
.more{color:var(--ink);background:none;border:0;padding:6px 0;min-height:28px;cursor:pointer;font:400 12px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:5px}
.more::after{content:" \203A"}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* hero: Model of the Week on a black band */
.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.hero .halo{width:120px;height:120px;display:grid;place-items:center}
.hero .halo svg{width:100%;height:100%;color:var(--ink)}
.hero .name{font:500 44px/1.04 var(--f-text);letter-spacing:-.03em;margin-top:10px;text-wrap:balance}
.hero .by{font:400 13px/1.4 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.hero .big{font:400 min(64px,15vw)/1 var(--f-dot);letter-spacing:.04em;margin-top:18px}
.hero .why{font-size:15px;color:var(--ink2);max-width:520px;margin-top:6px}
.hero .ctas{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.hero .meter{width:min(100%,420px);margin-top:6px}
@media (min-width:735px){.hero .name{font-size:64px}.hero .big{font-size:96px}.hero .halo{width:150px;height:150px}}
@media (min-width:1069px){.hero .name{font-size:80px}.hero .big{font-size:120px}}

/* lists: a strong rule on top, hairlines between rows, no boxes */
.group{border-top:2px solid var(--ink)}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px 14px;padding:12px 2px;min-height:56px;width:100%;background:none;border:0;border-bottom:1px solid var(--hair);text-align:left;cursor:pointer;color:var(--ink)}
.item.nolink{cursor:default}
button.item:hover{background:var(--panel)}
.item .rk{font:400 12px/1 var(--f-mono);color:var(--ink2);min-width:24px;text-align:right}
.item .t{min-width:0}
.item .t b{display:block;font-weight:500;overflow-wrap:anywhere}
.item .t > span{display:block;font:400 12px/1.5 var(--f-mono);letter-spacing:.01em;color:var(--ink2);overflow-wrap:anywhere}
.item .v{font:400 19px/1 var(--f-dot);letter-spacing:.04em;text-align:right;white-space:nowrap}
.item .v.plain{font:400 12px/1.4 var(--f-mono);letter-spacing:.02em}
.item .bar{grid-column:2 / 4;margin-top:6px;max-width:480px}
.item .ic{width:36px;height:36px;border-radius:50%;border:1px solid var(--hair);display:grid;place-items:center;flex:none}
.item .ic svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.chev{color:var(--ink2);font:400 18px/1 var(--f-mono)}
.cols{display:grid;grid-template-columns:1fr;gap:28px}
@media (min-width:900px){.cols{grid-template-columns:1fr 1fr;gap:40px}}
.cols > *{min-width:0}

/* strength meter: a row of dots, like the desk's dot pictures. Filled dots = how strong. */
.bar{display:block;height:8px;background:radial-gradient(circle closest-side,color-mix(in srgb,var(--ink) 22%,transparent) 45%,transparent 58%) 0 50%/calc(100% / 24) 8px repeat-x}
.bar i{display:block;height:100%;background:radial-gradient(circle closest-side,var(--c,var(--ink)) 66%,transparent 78%) 0 50%/var(--dw,8px) 8px repeat-x}

/* controls: outlined pills in Space Mono, like the desk's category filters */
.seg{display:flex;flex-wrap:wrap;gap:8px;max-width:100%;padding:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:1px solid var(--hair);border-radius:var(--pill);padding:7px 14px;min-height:32px;font:400 12px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;color:var(--ink2)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{border:1.5px solid var(--ink);color:var(--ink);padding:6.5px 13.5px}
.seg .lbl{flex:none;align-self:center;font:400 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding-right:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{width:100%;max-width:560px;background:transparent;border:1px solid var(--hair);border-radius:var(--pill);padding:10px 18px;font:400 16px/1.3 var(--f-text);color:var(--ink)}
.field:focus{border-color:var(--ink);outline:none}
.field::placeholder{color:var(--ink2)}
select.field{max-width:280px;font:400 12px/1.2 var(--f-mono);letter-spacing:.06em;padding:10px 16px;text-transform:uppercase}
.count{font:400 12px/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.legend{display:flex;align-items:center;gap:10px;font:400 12px/1.4 var(--f-mono);color:var(--ink2)}
.legend .bar{width:96px}
.legend i.grad{display:block;width:96px;height:6px;border-radius:3px}
.tag{font:inherit;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
.tag.open{color:var(--ink)}

/* news */
.story{display:block;padding:16px 2px;border-bottom:1px solid var(--hair)}
.story h3{font-size:18px}
.story p{margin:6px 0 0;font-size:15px;line-height:1.45;color:var(--ink2)}
.story .meta{margin-top:8px}
.lead h2{font-size:30px;line-height:1.12}
@media (min-width:735px){.lead h2{font-size:44px}}

/* award touts */
.tout{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 16px;background:transparent;border:1px solid var(--hair);border-radius:24px;width:100%;cursor:pointer;color:var(--ink)}
.tout:hover{border-color:var(--ink)}
.tout .n{font:500 30px/1.1 var(--f-text);letter-spacing:-.02em}
.tout .sc{font:400 30px/1 var(--f-dot);letter-spacing:.04em}
.touts{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:735px){.touts{grid-template-columns:1fr 1fr}}

/* prose */
.prose{max-width:692px;display:flex;flex-direction:column;gap:14px}
.prose p{margin:0}
.code{font:400 13px/1.8 var(--f-mono);letter-spacing:0;border:1px solid var(--hair);border-radius:16px;padding:16px;overflow-x:auto;white-space:pre;max-width:100%}
.scale{max-width:420px}
.scale-l{display:flex;justify-content:space-between;max-width:420px;font:400 12px/1.4 var(--f-mono);color:var(--ink2);margin-top:8px}

/* makers */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0;border-top:2px solid var(--ink)}
.mk{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px 12px 14px;min-height:118px;background:none;border:0;border-bottom:1px solid var(--hair);border-right:1px solid var(--hair);text-align:left;color:var(--ink);cursor:pointer;min-width:0}
.mk.nolink{cursor:default}
button.mk:hover{background:var(--panel)}
.mk .lg{width:30px;height:30px}
.mk b{font-weight:500;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.mk span{font:400 11px/1.4 var(--f-mono);letter-spacing:.04em;color:var(--ink2)}
.mk .dw{font:400 19px/1 var(--f-dot);letter-spacing:.04em;color:var(--ink)}

  return '<button type="button" class="item" data-model="' + esc(m.id) + '"><span class="rk num">' + rank + '</span><span class="t">' + nm(m.maker, m.name, cleanName(m.name) + (m.partial && k === 'ars' ? ' *' : '')) + '<span>' + esc(m.maker) + ' · ' + openTag(m.open) + (priceLine(m) ? ' · ' + esc(priceLine(m)) : '') + '</span></span><span class="v num" style="' + heatText(k, m[k]) + '">' + nf(m[k]) + '</span>' + bar(k, m[k], max) + '</button>';
}
function badgeItem(a, withRule){
  var m = a.model, link = m.id && byId[m.id];
  var inner = icon(a.badge) + '<span class="t"><span>' + esc(S('b_' + a.badge)) + '</span>' + nm(m.maker, m.name, cleanName(m.name)) + '<span>' + esc(m.maker) + ' · ' + esc(a.stat) + '</span>' + (withRule ? '<span class="meta" style="margin-top:2px">' + esc(S(a.rule)) + '</span>' : '') + '</span>' + (link ? '<span class="chev" aria-hidden="true">›</span>' : '<span></span>');
  return link ? '<button type="button" class="item" data-model="' + esc(m.id) + '">' + inner + '</button>' : '<div class="item nolink">' + inner + '</div>';
}
function boardName(key){ var b = D.arena.boards.filter(function(x){ return x.key === key; })[0]; return b ? b.name[lang] : key; }
function battleItem(b){
  return '<div class="item nolink">' + icon('battle') + '<span class="t"><span>' + esc(boardName(b.board)) + '</span>' + nm(b.maker, b.winner, b.winner) + '<span>' + esc(b.maker) + ' · ' + (b.gap > 0 ? '+' + b.gap + ' ' + esc(S('gap')) : esc(S('tied'))) + ' ' + esc(b.second) + '</span></span><span class="v num">' + nf(b.score) + '</span></div>';
}
function storyHTML(n){
  var tag = n.open === 'open' ? openTag(true) : n.open === 'closed' ? openTag(false) : '<span class="tag">' + esc(S('unclear')) + '</span>';
  return '<article class="story"><h3>' + esc(n.title) + '</h3><p>' + esc(n.summary) + '</p><div class="meta">' + esc(shortDate(n.date)) + ' · ' + logo(n.maker, n.models, 'sm') + esc(n.maker) + ' · ' + tag + ' · <a href="' + esc(n.url) + '" target="_blank" rel="noopener">' + esc(S('source')) + '</a></div></article>';
}
function rumorHTML(r){ return '<article class="story"><h3>' + esc(r.title) + '</h3><p>' + esc(r.summary) + '</p><div class="meta">' + esc(S('rumor')) + ' · <a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(S('source')) + '</a></div></article>'; }

/* ---------- views ---------- */

  h += '<section class="s band"><div class="w stack"><div class="head"><h2>' + esc(S('badgesT')) + '</h2><button type="button" class="more" data-go="awards">' + esc(S('seeAll')) + '</button></div><div class="cols"><div class="group">' + A.week.slice(1, 6).map(function(a){ return badgeItem(a); }).join('') + '</div><div class="group">' + A.week.slice(6).map(function(a){ return badgeItem(a); }).join('') + '</div></div></div></section>';

function hwGroup(m){ var t = m.hw.tier; if (t === 'cloud') return 'cloud'; if (t === 'phone') return 'phone'; if (t === 'laptop16') return '16'; if (t === 'pc32' || t === 'mac48' || t === 'ws64') return '64'; if (t === 'mini96' || t === 'studio128' || t === 'studio256') return '256'; if (t === 'ultra512' || t === 'server1t' || t === 'cluster') return 'big'; return 'unknown'; }
function rankList(){
  var k = st.metric, q = st.q.trim().toLowerCase();
  var all = scored.filter(function(m){ return m[k] != null; }).sort(function(a, b){ return b[k] - a[k]; });
  var list = all.filter(function(m){ return st.open === 'all' || (st.open === 'open') === m.open; })
    .filter(function(m){ return st.hw === 'any' || hwGroup(m) === st.hw; })
    .filter(function(m){ return !q || (m.name + ' ' + m.maker).toLowerCase().indexOf(q) >= 0; });
  var max = all.length ? all[0][k] : 0;
  return '<p class="count">' + list.length + ' ' + esc(S('models')) + '</p><div class="group">' + (list.length ? list.map(function(m){ return modelItem(m, k, max, all.indexOf(m) + 1); }).join('') : '<div class="item nolink"><span></span><span class="t"><span>—</span></span></div>') + '</div>';
}

  h += '<p class="meta">' + esc(S('updated')) + ' ' + esc(b.updated) + ' · ' + esc(b.votes) + ' ' + esc(S('votes')) + ' · <a href="' + esc(b.url) + '" target="_blank" rel="noopener">arena.ai</a></p></div></section>';
  h += '<section class="s"><div class="w stack"><p class="eyebrow">' + esc(S('labTitle')) + '</p><h2>' + esc(S('labSub')) + '</h2><p class="meta">' + esc(S('labStatus')) + '</p><ol class="prose" style="padding-left:20px;margin:0;gap:6px">' + S('labRules').map(function(r){ return '<li>' + esc(r) + '</li>'; }).join('') + '</ol>';
  if (onClaude) h += '<div class="cols" style="margin-top:12px"><div class="stack vote" id="vote-motw"></div><div class="stack vote" id="vote-prompt"></div></div>';

/* ---------- prices: real API prices per model, and the subscriptions people pay ---------- */
function priceList(){
  var list = scored.filter(function(m){ return m.cost1k != null; }).slice();
  list.sort(function(a, b){ return st.psort === 'cheap' ? a.cost1k - b.cost1k : b.cost1k - a.cost1k; });
  var costs = list.map(function(m){ return m.cost1k; }).sort(function(a, b){ return a - b; }), max = costs[costs.length - 1] || 1;
  var missing = scored.filter(function(m){ return m.cost1k == null; });
  return '<p class="count">' + list.length + ' ' + esc(S('models')) + '</p><div class="group">' + list.map(function(m, i){
    var t = costs.length > 1 ? costs.indexOf(m.cost1k) / (costs.length - 1) : 1;
    return '<button type="button" class="item" data-model="' + esc(m.id) + '"><span class="rk num">' + (i + 1) + '</span><span class="t">' + nm(m.maker, m.name, cleanName(m.name)) + '<span>' + esc(S('pIn')) + ' ' + esc(usd(m.pin)) + ' · ' + esc(S('pOut')) + ' ' + esc(usd(m.pout)) + ' · ' + esc(S('perM')) + '</span></span><span class="v num" style="' + scoreStyle(t) + '">' + esc(cost(m.cost1k)) + '</span>' + meter(t, m.cost1k / max) + '</button>';
  }).join('') + '</div>' + (missing.length ? '<p class="meta">' + esc(S('noPrice')) + ': ' + missing.map(function(m){ return esc(cleanName(m.name)); }).join(', ') + '</p>' : '');
}
function planHTML(p){
  var src = p.plans.map(function(x){ return x.source; }).filter(Boolean)[0];
  var h = '<div class="plan"><div class="plan-h">' + logo(p.key, '', 'big') + '<div><h3>' + esc(p.key) + '</h3><span class="meta">' + esc(p.product || '') + '</span></div></div>';
  if (p.free) h += '<p class="plan-free"><b class="mono">' + esc(S('freeT').toUpperCase()) + '</b> ' + esc(p.free.replace(/^Free[^:]*:\s*/i, '')) + '</p>';
  h += '<div class="group">' + p.plans.map(function(x){
    var price = x.usd_month != null ? usd(x.usd_month) + ' ' + S('perMo') : (x.usd_year != null ? usd(x.usd_year) + ' ' + S('perYr') : S('onRequest'));
    return '<div class="item nolink"><span></span><span class="t"><b>' + esc(x.name) + '</b><span>' + esc(S('aud_' + x.audience) || '') + (x.eur_month != null ? ' · ' + esc(eur(x.eur_month)) + ' ' + esc(S('perMo')) : '') + '</span><span class="plan-inc">' + esc(x.includes || '') + '</span></span><span class="v plain num">' + esc(price) + '</span></div>';
  }).join('') + '</div>' + (src ? '<p class="meta" style="margin:6px 0 0"><a href="' + esc(src) + '" target="_blank" rel="noopener">' + esc(S('source')) + '</a>' + (p.checked ? ' · ' + esc(dateFmt(p.checked)) : '') + '</p>' : '') + '</div>';
  return h;
}
function vPrices(){
  var d = (scored.filter(function(m){ return m.pdate; })[0] || {}).pdate || D.edition.date;
  var h = '<section class="s"><div class="w stack">' + head(S('prices'), S('pricesSub'));
  h += '<h2 style="margin-top:16px">' + esc(S('apiT')) + '</h2><p class="meta" style="margin-top:-12px">' + esc(S('apiSub').replace('{d}', dateFmt(d))) + '</p>';

/* ---------- makers: every company behind the models, and the whole logo library ---------- */
var LIB = LG.library || [], sprite = {state: 'idle'};
function makerStats(){
  var by = {};
  scored.forEach(function(m){ var k = nkey(m.maker); var e = by[k] || (by[k] = {maker: m.maker, n: 0, best: null, name: m.name}); e.n++; if (!e.best || m.ars > e.best.ars) e.best = m; });
  return Object.keys(by).map(function(k){ return by[k]; }).sort(function(a, b){ return b.best.ars - a.best.ars; });
}
function libLogo(key, name){
  if (LG.logos[key]) return '<svg class="lg" viewBox="' + esc(LG.logos[key].vb) + '" fill="currentColor" aria-hidden="true">' + LG.logos[key].body + '</svg>';
  if (sprite.state === 'ok') return '<svg class="lg" aria-hidden="true"><use href="#lg-' + esc(key) + '"></use></svg>';
  return logo(name, '', '');
}
function libList(){
  var q = st.mq.trim().toLowerCase();
  var list = LIB.filter(function(e){ return st.mg === 'all' || (st.mg === 'badge' ? e[3] === 'B' : e[2] === st.mg && e[3] !== 'B'); })
    .filter(function(e){ return !q || (e[1] + ' ' + e[0]).toLowerCase().indexOf(q) >= 0; });
  return '<p class="count">' + list.length + ' / ' + LIB.length + '</p><div class="mgrid lib">' + list.map(function(e){
    return '<div class="mk nolink" title="' + esc(S('src' + e[3])) + '">' + libLogo(e[0], e[1]) + '<b>' + esc(e[1]) + '</b></div>'; }).join('') + '</div>';
}
function loadSprite(){
  if (sprite.state !== 'idle' || !LIB.length) return; sprite.state = 'loading';
  fetch('logos/sprite.svg').then(function(r){ if (!r.ok) throw new Error(r.status); return r.text(); }).then(function(t){
    if (t.indexOf('<symbol') < 0) throw new Error('no symbols');
    var d = document.createElement('div'); d.setAttribute('aria-hidden', 'true'); d.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden';
    d.innerHTML = t.replace(/<\?xml[^>]*>/, ''); document.body.appendChild(d); sprite.state = 'ok';
    var el = document.getElementById('lib-list'); if (el) el.innerHTML = libList();
  }).catch(function(){ sprite.state = 'off'; });
}
function vMakers(){
  var ms = makerStats(), nB = LIB.filter(function(e){ return e[3] === 'B'; }).length;
  var h = '<section class="s"><div class="w stack">' + head(S('makers'), S('makersSub'));
  h += '<h2 style="margin-top:16px">' + esc(S('inRank')) + '</h2><p class="meta" style="margin-top:-12px">' + esc(S('inRankSub')) + '</p><div class="mgrid">' + ms.map(function(e){

function halftone(){
  var box = document.querySelector('[data-halftone]'); if (!box) return;
  var svg = box.querySelector('svg'); if (!svg || !window.XMLSerializer) return;
  try {
    var src = svg.cloneNode(true); src.setAttribute('xmlns', 'http://www.w3.org/2000/svg'); src.setAttribute('width', '96'); src.setAttribute('height', '96'); src.setAttribute('style', 'color:#000;fill:#000');
    var img = new Image(); img.onload = function(){
      try {
        var N = 26, c = document.createElement('canvas'); c.width = c.height = N * 4; var x = c.getContext('2d'); x.drawImage(img, 0, 0, N * 4, N * 4);
        var px = x.getImageData(0, 0, N * 4, N * 4).data, out = '';
        for (var j = 0; j < N; j++) for (var i = 0; i < N; i++){
          var a = 0; for (var yy = 0; yy < 4; yy++) for (var xx = 0; xx < 4; xx++) a += px[((j * 4 + yy) * N * 4 + i * 4 + xx) * 4 + 3];
          a /= 16 * 255; if (a > .06) out += '<circle cx="' + (i + .5) + '" cy="' + (j + .5) + '" r="' + (Math.sqrt(a) * .5).toFixed(2) + '"/>';
        }

      } catch (e) {}

    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(src));
  } catch (e) {}
}

  if (e.target.id === 'rank-q'){ st.q = e.target.value; document.getElementById('rank-list').innerHTML = rankList(); }

  if (e.target.id === 'mk-q'){ st.mq = e.target.value; document.getElementById('lib-list').innerHTML = libList(); }
  if (e.target.id === 'gar-q'){ st.gq = e.target.value; st.glimit = 60; document.getElementById('gar-list').innerHTML = garageList(); }
});
document.addEventListener('change', function(e){ if (e.target.id === 'hw-sel'){ st.hw = e.target.value; document.getElementById('rank-list').innerHTML = rankList(); } });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSheet(); });
window.addEventListener('hashchange', function(){ var v = location.hash.slice(1); if (VIEWS.indexOf(v) >= 0 && v !== view){ view = v; render(true); } });

/* ---------- fan votes: only inside Claude, where the page has its shared database ---------- */
var WEEK = D.edition.week, NOMINEES = D.nominees || [], PROMPTS = D.prompts || {en:[], fr:[]};
var V = {state:'off', mine:{}, tally:{motw:{}, prompt:{}}, db:null, uid:null, busy:false, err:false};
function paintVotes(){ var a = document.getElementById('vote-motw'), b = document.getElementById('vote-prompt'); if (!a || !b) return; a.innerHTML = voteBox('motw', S('fanMotw'), NOMINEES); b.innerHTML = voteBox('prompt', S('fanPrompt'), PROMPTS[lang] || []); }
function voteBox(kind, title, opts){
  var tl = V.tally[kind], tot = 0; Object.keys(tl).forEach(function(k){ tot += tl[k]; });
  var can = V.state === 'on' && !V.busy;
  var h = '<p class="eyebrow">' + esc(S('fanVote')) + '</p><h3>' + esc(title) + '</h3><div class="group">';
  h += opts.map(function(o){ var n = tl[o[0]] || 0, p = tot ? Math.round(n / tot * 100) : 0, mine = V.mine[kind] === o[0];
    return '<button type="button" class="opt' + (mine ? ' mine' : '') + '" data-vote="' + kind + '" data-val="' + esc(o[0]) + '"' + (can ? '' : ' disabled') + ' aria-pressed="' + mine + '"><span class="fillv" style="width:' + p + '%"></span><span><b style="font-weight:' + (mine ? 600 : 400) + '">' + esc(o[1]) + '</b></span><span class="meta num">' + (V.state === 'off' ? '' : p + '% · ' + n) + '</span></button>'; }).join('') + '</div>';
  if (V.state !== 'off') h += '<p class="meta" style="margin:0">' + tot + ' ' + esc(S('totalVotes')) + '</p>';
  if (V.state === 'off') h += '<p class="meta" style="margin:0">' + esc(S('voteOff')) + '</p>';
  if (V.state === 'ro') h += '<p class="meta" style="margin:0">' + esc(S('voteRO')) + '</p>';
  if (V.err) h += '<p class="meta" style="margin:0;color:var(--ink)">' + esc(S('voteErr')) + '</p>';
  return h;
}
function castVote(kind, val){
  if (V.state !== 'on' || V.busy) return;
  var next = {week: WEEK, motw: V.mine.motw || null, prompt: V.mine.prompt || null}; next[kind] = val;
  V.busy = true; V.err = false; var prev = V.mine[kind]; V.mine[kind] = val; paintVotes();
  V.db.doc('votes/' + V.uid).set(next).then(function(){ V.busy = false; paintVotes(); }, function(err){
    V.busy = false; V.mine[kind] = prev; if (err && err.code === 'invalid_argument') V.state = 'ro'; else V.err = true; paintVotes();
  });
}
(function initVotes(){
  if (!onClaude) return;
  Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function(r){
    var db = r[0], user = r[1]; if (!db || !user) return;
    return Promise.all([user.id(), user.can('data.write')]).then(function(x){
      V.db = db; V.uid = x[0]; V.state = x[0] ? (x[1] === false ? 'ro' : 'on') : 'ro';
      db.collection('votes').where('week', '==', WEEK).onSnapshot(function(snap){
        var t = {motw:{}, prompt:{}};
        snap.docs.forEach(function(d){ var b = d.data() || {}; if (b.motw) t.motw[b.motw] = (t.motw[b.motw] || 0) + 1; if (b.prompt) t.prompt[b.prompt] = (t.prompt[b.prompt] || 0) + 1; if (d.id === V.uid && !V.busy) V.mine = {motw: b.motw || undefined, prompt: b.prompt || undefined}; });
        V.tally = t; paintVotes();
      }, function(){ V.state = 'off'; paintVotes(); });
      paintVotes();
    });
  }).catch(function(){});
})();

render(false);
})();
</script>
